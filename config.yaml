---
# How async /asyncquery results are received (see README "Async queries").
# Defaults shown below; uncomment to change. `auto` = direct callback for local
# targets, cloudflared tunnel for remote, poll fallback if unavailable.
# callback:
#   mode: auto  # auto | direct | tunnel | poll
#   host: 127.0.0.1  # advertised host for direct (e.g. host.docker.internal)
#   bind: 127.0.0.1  # bind address (0.0.0.0 to reach from a container)
#   port: 0  # 0 = OS-assigned ephemeral port
#   cloudflared_path: cloudflared

environments:
  bte:
    local: http://localhost:3000/v1
    ci: https://bte.ci.transltr.io/v1
    test: https://bte.test.transltr.io/v1
    prod: https://bte.transltr.io/v1
  aragorn:
    local: http://localhost:5000/aragorn
    dev: https://aragorn.renci.org/aragorn
    ci: https://aragorn.ci.transltr.io/aragorn
    test: https://aragorn.test.transltr.io/aragorn
    prod: https://aragorn.transltr.io/aragorn
